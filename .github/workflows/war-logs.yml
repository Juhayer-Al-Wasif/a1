name: War logs

on:
  schedule:
    - cron: "*/10 * * * *"        # every 10 min (GitHub may delay runs a few minutes; 5 is the minimum)
  workflow_dispatch:
    inputs:
      backfill:
        description: "On a clan's FIRST pass, post its N newest war battles (0 = just record what exists)"
        default: "0"

concurrency:
  group: war-logs
  cancel-in-progress: false

permissions:
  contents: write                  # lets the job commit state.json (which battles were already posted)

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Week stamp (cache key)
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            .card_cache
            fonts
          key: crwar-${{ steps.week.outputs.w }}
          restore-keys: crwar-

      - name: Post new war battles
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          SECRETS_JSON: ${{ toJSON(secrets) }}      # every secret, so config.json can use ANY webhook secret name
        run: python cr_war_discord.py --backfill "${{ github.event.inputs.backfill || '0' }}"

      - name: Save state
        if: always()
        run: |
          git config user.name "war-log-bot"
          git config user.email "war-log-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
